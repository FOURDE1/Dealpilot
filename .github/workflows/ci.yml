# CI (A-02, D-026) — lint / typecheck / test / build on every push.
# No-PR workflow (D-021): runs on pushes to the shared branches AND the agents'
# feature branches, so pre-merge feedback exists without pull requests.
# Actions are pinned to full commit SHAs (CLAUDE.md supply-chain rules).
name: CI

on:
  push:
    branches: [main, develop, 'ahmad/**', 'hussein/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede runs on feature branches only — on the shared branches every
  # commit keeps its verdict (no-PR workflow: this run IS the commit's gate).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  checks:
    name: lint / typecheck / test / build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: '1'
    services:
      # Ephemeral Postgres per run (ADR-023). Mapped to host port 5434 because
      # the db default URL and the api integration tests target localhost:5434
      # (same port the local docker-compose maps — one URL everywhere).
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealpilot
          POSTGRES_PASSWORD: dealpilot
          POSTGRES_DB: dealpilot
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dealpilot -d dealpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # The Socket.IO adapter (ADR-004/012). Present so the cross-instance
      # fan-out test actually runs: production has two API tasks behind the
      # ALB, so a message emitted by task A must reach a browser connected to
      # task B, and that claim is worth nothing untested. Port 6381 matches
      # docker-compose — one URL everywhere.
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout talks to git — don't leave the token behind.
          persist-credentials: false

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9 (peeled commit)

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile; lifecycle scripts blocked by pnpm default)
        run: pnpm install --frozen-lockfile

      - name: Database from migration zero (proves reset path + dev app-role bootstrap)
        # DB_RESET_CONFIRM because reset() refuses any database not named
        # *_test — it was wiping a developer's local database. Here the target
        # is an ephemeral service container that exists for this job alone, so
        # confirming is exactly what the guard wants: say out loud that you mean
        # this database.
        env:
          DB_RESET_CONFIRM: dealpilot
        run: pnpm --filter @dealpilot/db --fail-if-no-match run db:reset

      - name: Build + typecheck
        run: pnpm turbo run build typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (RLS_REQUIRED — DB-dependent suites must run, never skip)
        # test:ci refuses an empty collection — the in-file RLS_REQUIRED
        # tripwires only fire if the files are collected at all.
        run: pnpm test:ci
        env:
          RLS_REQUIRED: '1'

      - name: i18n key parity (fr-CA reference — HO-03)
        run: pnpm --filter @dealpilot/i18n --fail-if-no-match run check:parity

  e2e:
    name: e2e (real browser, real worker process)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: '1'
    # A separate job from `checks`, deliberately. These specs drive a real
    # Chrome against a real API and a real database, so they fail for a
    # different class of reason than a unit test does — and mixing the two
    # verdicts into one job makes "CI is red" stop meaning anything specific.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealpilot
          POSTGRES_PASSWORD: dealpilot
          POSTGRES_DB: dealpilot
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dealpilot -d dealpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9 (peeled commit)

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile; lifecycle scripts blocked by pnpm default)
        run: pnpm install --frozen-lockfile

      - name: Install Google Chrome
        # playwright.config.ts pins `channel: 'chrome'` so the owner's machine
        # uses the Chrome already installed there instead of downloading a
        # second browser. CI has no Chrome until we ask for one.
        run: pnpm --filter @dealpilot/web exec playwright install --with-deps chrome

      - name: Database from migration zero (for the workers probe below)
        # This step exists ONLY to give the workers boot/drain probe a migrated
        # database in its existing position — and it also CREATES the database:
        # the service container above only creates `dealpilot`, and creation
        # happens inside the CLI's `reset <dbname>` path. The suite's own
        # database is prepared AGAIN by scripts/e2e.mjs, unconditionally,
        # because a runner that trusts a previous step to have reset the
        # database behaves differently when run alone — the divergence F-74
        # exists to kill (~7s of a 20-minute budget). The reset confirmation
        # variable is gone from this job: the name ends _test, so reset()'s own
        # guard accepts it on its terms (and a vitest guard fails `checks` if the
        # variable ever reappears in this job block).
        run: pnpm --filter @dealpilot/db --fail-if-no-match run db:reset dealpilot_e2e_test

      - name: Build
        run: pnpm turbo run build

      - name: Worker process starts and drains on SIGTERM
        # The workers had no entrypoint at all: `start()` was exported and called
        # by nothing — no bin, no script, no Dockerfile. That is precisely why
        # the BullMQ queue-name bug lived eight commits; the process that would
        # have hit it could not be launched. This step is the answer to "does
        # anything ever run this", and it has to stay cheap enough to keep.
        #
        # SIGTERM is checked here rather than locally because Windows has no
        # real POSIX signals, so the drain path cannot be exercised on the
        # owner's machine at all.
        env:
          DATABASE_URL: postgresql://dealpilot_app:dealpilot_app_dev@localhost:5434/dealpilot_e2e_test
          REDIS_URL: redis://localhost:6381
          NODE_ENV: development
        run: |
          set -euo pipefail
          node apps/workers/dist/main.js > /tmp/workers.log 2>&1 &
          WORKERS_PID=$!

          for _ in $(seq 1 30); do
            grep -q '"msg":"workers up"' /tmp/workers.log && break
            if ! kill -0 "$WORKERS_PID" 2>/dev/null; then
              echo "::error::workers exited during boot"
              cat /tmp/workers.log
              exit 1
            fi
            sleep 1
          done
          grep -q '"msg":"workers up"' /tmp/workers.log || {
            echo "::error::workers never reported ready within 30s"
            cat /tmp/workers.log
            exit 1
          }

          kill -TERM "$WORKERS_PID"
          set +e
          wait "$WORKERS_PID"
          EXIT=$?
          set -e
          cat /tmp/workers.log

          grep -q '"msg":"workers down"' /tmp/workers.log || {
            echo "::error::SIGTERM did not drain cleanly — in-flight jobs would be killed mid-send"
            exit 1
          }
          [ "$EXIT" -eq 0 ] || {
            echo "::error::workers exited $EXIT after SIGTERM, expected 0"
            exit 1
          }

      - name: e2e (the same one command the owner runs)
        # One command on purpose, and no env: block at all. Every value the old
        # inline shell set here — the URLs, REDIS_URL, the ports, the generated
        # BETTER_AUTH_SECRET (node:crypto now, not openssl: a stock Windows box
        # has no openssl, so the openssl line could never have been the local
        # line) — comes from scripts/e2e.mjs, so this step and `pnpm e2e` on a
        # developer machine are the SAME program. The runner keeps everything
        # this step's shell existed for: an early API death is caught by a
        # liveness check with the log attached instead of surfacing as every
        # spec failing to reach the server, and the health poll now parses the
        # body — the old `curl -fsS` accepted a 200 that said db:"down".
        run: node scripts/e2e.mjs

      - name: API log (on failure)
        if: failure()
        run: cat .e2e/api.log || true

      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            .e2e/api.log
          retention-days: 7
          if-no-files-found: ignore
