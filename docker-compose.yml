services:
  db:
    image: postgres:16-alpine
    container_name: dealpilot-db
    environment:
      POSTGRES_USER: dealpilot
      POSTGRES_PASSWORD: dealpilot
      POSTGRES_DB: dealpilot
    ports:
      # Host port is overridable because it has now collided twice: 5432/5433
      # were taken when this was written, and 5434 was taken by another local
      # project on 2026-08-14. Default unchanged — set DEALPILOT_DB_PORT only
      # when the default is busy, and point tests at it with DB_ADMIN_URL.
      - "${DEALPILOT_DB_PORT:-5434}:5432"
    volumes:
      - dealpilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealpilot -d dealpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # BullMQ backing store and the Socket.IO adapter (ADR-004/012). Local only —
  # deployed environments use ElastiCache Valkey.
  redis:
    image: redis:7-alpine
    container_name: dealpilot-redis
    ports:
      - "${DEALPILOT_REDIS_PORT:-6381}:6379"  # 6379/6380 are taken by other local projects
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dealpilot-pgdata:
