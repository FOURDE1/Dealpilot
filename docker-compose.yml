services:
  db:
    image: postgres:16-alpine
    container_name: dealpilot-db
    environment:
      POSTGRES_USER: dealpilot
      POSTGRES_PASSWORD: dealpilot
      POSTGRES_DB: dealpilot
    ports:
      - "5434:5432"  # host 5434: 5432/5433 are occupied by other local projects
    volumes:
      - dealpilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealpilot -d dealpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # BullMQ backing store and the Socket.IO adapter (ADR-004/012). Local only —
  # deployed environments use ElastiCache Valkey.
  redis:
    image: redis:7-alpine
    container_name: dealpilot-redis
    ports:
      - "6381:6379"  # host 6381: 6379/6380 are taken by other local projects
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dealpilot-pgdata:
